# On every push and pull request, and before every release (release.yml runs it): the tests
# on Windows, macOS and Linux, and on each the one-line installer (installing the package
# just built), the app's icon, opening and stopping the app, and the uninstaller.
# Actions are pinned to a commit (a tag can be moved); Dependabot proposes updates.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.12"]
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: Lint
        run: uv run --python ${{ matrix.python }} --extra dev pyflakes resume_shortlister tests scripts
      - name: Test
        run: >-
          uv run --python ${{ matrix.python }} --extra dev --extra anthropic --extra google --extra ollama
          pytest -q --junitxml=test-results.xml
      - name: Show each failure on the run's summary page
        if: failure()
        run: uv run --python ${{ matrix.python }} --no-project python -m scripts.ci_failures test-results.xml

  install:
    name: Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build the package
        shell: bash
        run: |
          python -m pip wheel --no-deps -w dist .
          wheel="$(python -c "import glob, pathlib; print(pathlib.Path(glob.glob('dist/*.whl')[0]).resolve().as_uri())")"
          echo "RESUME_SHORTLISTER_PACKAGE=resume-shortlister[anthropic,google,ollama] @ $wheel" >> "$GITHUB_ENV"
      - name: Install with install.ps1, as from the Command Prompt
        if: runner.os == 'Windows'
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy ByPass -Command "Get-Content -Raw install.ps1 | iex" < NUL
      - name: Install with install.sh
        if: runner.os != 'Windows'
        run: sh install.sh < /dev/null
      - name: The icon is there
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) test -x "$HOME/Applications/Resume Shortlister.app/Contents/MacOS/resume-shortlister" ;;
            Linux) test -f "$HOME/.local/share/applications/resume-shortlister.desktop" ;;
            Windows) test -f "$(cygpath "$APPDATA")/Microsoft/Windows/Start Menu/Programs/Resume Shortlister.lnk" ;;
          esac
      - name: Open the app as its icon does, then stop it
        shell: bash
        run: |
          app="$HOME/.local/bin/resume-shortlister"
          "$app" --version
          url="$("$app" open --no-browser)" || { cat "$HOME/.resume-shortlister/app.log"; exit 1; }
          curl -fsS "$url" | grep -q 'name="resume-shortlister-token"'
          echo "The app answered at $url."
          "$app" stop | grep -q "Stopped Resume Shortlister."
          ! curl -fsS "$url" > /dev/null 2>&1
      - name: Uninstall with uninstall.ps1
        if: runner.os == 'Windows'
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy ByPass -Command "Get-Content -Raw uninstall.ps1 | iex" < NUL
      - name: Uninstall with uninstall.sh
        if: runner.os != 'Windows'
        run: sh uninstall.sh < /dev/null
      - name: What the installer made is gone; the data is kept (nobody said to delete it)
        shell: bash
        run: |
          test ! -e "$HOME/.local/bin/resume-shortlister" && test ! -e "$HOME/.local/bin/resume-shortlister.exe"
          test ! -e "$HOME/Applications/Resume Shortlister.app"
          test ! -e "$HOME/.local/share/applications/resume-shortlister.desktop"
          if [ "$RUNNER_OS" = Windows ]; then test ! -e "$(cygpath "$APPDATA")/Microsoft/Windows/Start Menu/Programs/Resume Shortlister.lnk"; fi
          test -d "$HOME/.resume-shortlister"
