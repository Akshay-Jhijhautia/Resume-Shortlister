# add this repository and this workflow (release.yml, environments "pypi" and "testpypi")
# as a trusted publisher once.
# Actions are pinned to a commit (a tag can be moved); Dependabot proposes updates.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:  # the tests and installers on Windows, macOS and Linux must pass first
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - name: Check the tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' resume_shortlister/__init__.py)"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME, package $version"; exit 1; }
      - name: Point the README's links at GitHub for the PyPI page
        run: uv run --python 3.12 --no-project python -m scripts.pypi_readme "$GITHUB_SHA"
      - name: Build
        run: uv build
      - name: Check the browser app is in the wheel
        run: unzip -l dist/*.whl | grep -q 'resume_shortlister/web/static/index.html'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.ref_type == 'tag' && 'pypi' || 'testpypi' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: ${{ github.ref_type == 'tag' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
          # A rehearsal may be run again for a version already on TestPyPI; a release may not.
          skip-existing: ${{ github.ref_type != 'tag' }}

  github-release:
    if: github.ref_type == 'tag'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - name: The sample kit and the release notes
        run: |
          uv run --python 3.12 --extra dev python -m scripts.sample_kit dist/resume-shortlister-sample-resumes.zip
          uv run --python 3.12 --no-project python -m scripts.release_notes "$GITHUB_REF_NAME" > notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Resume Shortlister ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
